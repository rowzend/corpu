services:
  # Backend - Django/Python
  asncorpu_backend:
    build: ./backend
    container_name: asncorpu_backend_app
    restart: unless-stopped
    command: gunicorn core.wsgi:application --config gunicorn.conf.py
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=postgres-shared
      - DB_NAME=asncorpu_backend_db
      - DB_USER=asncorpu_user
      - DB_PASSWORD=asncorpu_secure_password_2026
      - DB_PORT=5432
      - REDIS_HOST=redis-main
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5406@Pessel!23#
      - REDIS_DB=4
      - DJANGO_MAX_REQUEST_SIZE=134217728
      - GUNICORN_TIMEOUT=60
      - GUNICORN_WORKERS=2
      - GUNICORN_WORKER_CLASS=sync
      - DEBUG=False
      - SECURE_SSL_REDIRECT=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,asncorpu_backend_app,asncorpu-nginx,172.16.30.139,103.143.152.139,asncorpu.pesisirselatankab.go.id
      - USE_X_FORWARDED_HOST=True
      - USE_X_FORWARDED_PORT=True
      - RUN_MIGRATIONS=0
      - RUN_COLLECTSTATIC=0
      - ESIMPEG_API_URL=http://host.docker.internal:8005
      - ESIMPEG_FALLBACK_ENABLED=True
      - PERMISSIONS_SUPERADMIN_OVERRIDE=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - Next.js (Production Build)
  asncorpu-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: asncorpu-frontend-nextjs
    expose:
      - "3004"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://172.16.30.139:3000/apicorpu/1.0
      - NEXT_PUBLIC_BACKEND_URL=http://172.16.30.139:3000
      - NEXT_PUBLIC_API_TIMEOUT=30000
      - NEXT_PUBLIC_APP_NAME=ASNCORPU
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_ESIMPEG_API_URL=http://172.16.30.139:8005
    restart: unless-stopped
    networks:
      - shared-network
    depends_on:
      - asncorpu_backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3004/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  asncorpu-nginx:
    image: nginx:alpine
    container_name: asncorpu-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    networks:
      - shared-network
    depends_on:
      - asncorpu_backend
      - asncorpu-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  static_volume:
  media_volume:
  logs_volume:

networks:
  shared-network:
    external: true
