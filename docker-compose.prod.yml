# =============================================================================
# PRODUCTION OVERRIDE — for VPS / production deployment!
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Internal port: 80 (matches all other containers: asncorpu, esimpeg-php, simau, etc.)
# =============================================================================

services:
  esimpeg-python:
    build:
      context: .
      dockerfile: Dockerfile
    image: esimpeg-python:latest
    container_name: esimpeg_python_app
    restart: unless-stopped
    # Production: gunicorn on port 80 (like all other containers)
    command: gunicorn esimpeg_core.wsgi:application --config gunicorn.conf.py --bind 0.0.0.0:80
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8005:80"
    environment:
      # Django Settings
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=esimpeg_core.settings
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ALLOWED_HOSTS=esimpeg.pesisirselatankab.go.id,esimpeg-python.pesisirselatankab.go.id,172.16.30.139,103.143.152.139,localhost
      
      # SSL Settings
      - SECURE_SSL_REDIRECT=False
      
      # Database Configuration
      - DB_HOST=mysql-main
      - DB_NAME=esimpeg_python_db
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-5406@Pessel!23#}
      - DB_PORT=3306
      
      # Redis Configuration
      - REDIS_HOST=redis-main
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-5406@Pessel!23#}
      - REDIS_DB=3
      - APP_KEY_PREFIX=esimpeg
      
      # Performance Settings
      - DJANGO_MAX_REQUEST_SIZE=134217728
      - GUNICORN_TIMEOUT=300
      - GUNICORN_WORKERS=4
      - GUNICORN_WORKER_CLASS=sync
      
      # Application Branding
      - APP_NAME=ESIMPEG
      - APP_LONG_NAME=Elektronik Sistem Informasi Manajemen Pegawai
      - APP_INSTANSI=Pemerintah Kabupaten Pesisir Selatan
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    networks:
      - proxy-network
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  static_volume:
    name: esimpeg_python_static
  media_volume:
    name: esimpeg_python_media
  logs_volume:
    name: esimpeg_python_logs

networks:
  proxy-network:
    external: true
    name: proxy-network
  shared-network:
    external: true
    name: shared-network
