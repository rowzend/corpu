services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: asncorpu-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asncorpu_backend_db
      POSTGRES_USER: asncorpu_user
      POSTGRES_PASSWORD: asncorpu_secure_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # External port 5433 to avoid conflict with other PostgreSQL
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asncorpu_user -d asncorpu_backend_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application
  asncorpu_backend:
    build: .
    container_name: asncorpu_backend_app
    restart: unless-stopped
    command: gunicorn core.wsgi:application --config gunicorn.conf.py
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8008:8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=asncorpu-backend-postgres
      - DB_NAME=asncorpu_backend_db
      - DB_USER=asncorpu_user
      - DB_PASSWORD=asncorpu_secure_password_2026
      - DB_PORT=5432
      - REDIS_HOST=asncorpu-backend-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=4
      # Memory and Request Size Limits (for handling large data like 9000+ records)
      - DJANGO_MAX_REQUEST_SIZE=134217728  # 128MB in bytes
      - GUNICORN_TIMEOUT=300  # 5 minutes timeout
      - GUNICORN_WORKERS=4
      - GUNICORN_WORKER_CLASS=sync
    deploy:
      resources:
        limits:
          memory: 1G  # Maximum memory limit
          cpus: '2.0'  # Maximum CPU usage
        reservations:
          memory: 512M  # Reserved memory
          cpus: '1.0'  # Reserved CPU
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.4-alpine
    container_name: asncorpu-backend-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - default

  # pgAdmin - PostgreSQL Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asncorpu-backend-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgpass:/pgpass:ro
    ports:
      - "5050:80"
    networks:
      - default
    depends_on:
      - postgres
    entrypoint: >
      /bin/sh -c "
      chmod 600 /pgpass;
      /entrypoint.sh
      "

volumes:
  static_volume:
  media_volume:
  logs_volume:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  default:
    driver: bridge
