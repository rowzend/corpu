name: Build & Deploy

on:
  push:
    branches: [main]
    tags:
      - v*

# Prevent parallel deploys
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/rowzend/corpu/asncorpu-backend
  FRONTEND_IMAGE: ghcr.io/rowzend/corpu/asncorpu-frontend

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tags
        id: tags
        run: |
          BASE="${{ env.BACKEND_IMAGE }}"
          TAGS="${BASE}:latest,${BASE}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${BASE}:v${VERSION}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tags
        id: tags
        run: |
          BASE="${{ env.FRONTEND_IMAGE }}"
          TAGS="${BASE}:latest,${BASE}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${BASE}:v${VERSION}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            DEPLOY_DIR=$HOME/Projects/asncorpu
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Clone or reset to latest
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            else
              git clone https://github.com/rowzend/corpu.git .
            fi

            # Generate backend/.env from GitHub secrets
            cat > backend/.env <<'ENVEOF'
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DB_HOST=postgres-shared
            DB_NAME=asncorpu_backend_db
            DB_USER=asncorpu_user
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_PORT=5432
            REDIS_HOST=redis-main
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DB=4
            MINIO_ENDPOINT=http://172.16.7.66:9000
            MINIO_ACCESS_KEY=admin
            MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
            MINIO_BUCKET=asncorpu-media
            MINIO_REGION=us-east-1
            MINIO_USE_PROXY=True
            MINIO_PROXY_URL=/media/minio/
            DJANGO_MAX_REQUEST_SIZE=134217728
            GUNICORN_TIMEOUT=60
            GUNICORN_WORKERS=2
            GUNICORN_WORKER_CLASS=sync
            ESIMPEG_API_URL=http://host.docker.internal:8005
            ESIMPEG_FALLBACK_ENABLED=True
            PERMISSIONS_SUPERADMIN_OVERRIDE=False
            ENVEOF

            # Set image tags to this exact commit
            export BACKEND_TAG=${{ github.sha }}
            export FRONTEND_TAG=${{ github.sha }}

            # Stop containers
            docker compose -f docker-compose.prod.yml down

            # Remove old images (force)
            docker rmi $(docker images 'ghcr.io/rowzend/corpu/asncorpu-backend' -q) 2>/dev/null || true
            docker rmi $(docker images 'ghcr.io/rowzend/corpu/asncorpu-frontend' -q) 2>/dev/null || true

            # Pull fresh images
            docker compose -f docker-compose.prod.yml pull

            # Start with force-recreate to ensure new images are used
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Cleanup
            docker image prune -f

            echo "Deploy selesai: $(date)"
