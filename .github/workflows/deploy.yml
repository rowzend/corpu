name: Build & Push

# Satu file untuk DUA repo (sinkron via push bersama):
#   - rowzend/corpu (branch main) → build paket rowzend/corpu/* (dipakai produksi).
#   - ProfNipu/asncorpu (branch master) → build paket profnipu/* (validasi + paket
#     sendiri; GITHUB_TOKEN tidak bisa push ke paket milik rowzend).
on:
  push:
    branches: [main, master]
    tags:
      - v*
  workflow_dispatch:

# Prevent parallel builds
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tags
        id: tags
        run: |
          if [ "${GITHUB_REPOSITORY}" = "rowzend/corpu" ]; then
            BASE="ghcr.io/rowzend/corpu/asncorpu-backend"
          else
            BASE="ghcr.io/profnipu/asncorpu-backend"
          fi
          TAGS="${BASE}:latest,${BASE}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${BASE}:v${VERSION}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tags
        id: tags
        run: |
          if [ "${GITHUB_REPOSITORY}" = "rowzend/corpu" ]; then
            BASE="ghcr.io/rowzend/corpu/asncorpu-frontend"
          else
            BASE="ghcr.io/profnipu/asncorpu-frontend"
          fi
          TAGS="${BASE}:latest,${BASE}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${BASE}:v${VERSION}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}

# ------------------------------------------------------------
# DEPLOY — pola ESIMPEG (Projects/ESIMPEG-Python/.github/workflows/ci-cd.yml):
# CI TIDAK SSH ke VPS. Runner GitHub memang tak bisa menjangkau port 22 VPS
# (port 22 tidak diteruskan ke internet oleh penyedia; diuji 24 Nov 2026 dari
# 6 node eksternal — semua timeout, sedangkan 443 terbuka). Job "Deploy via SSH"
# lama selalu gagal "dial tcp :22 i/o timeout" dan sudah DIHAPUS.
#
# Alur deploy sekarang:
#   push main → Actions build & push `:latest` + `:<sha>` ke GHCR
#   → Watchtower di VPS (jadwal 04:00) menarik `:latest` dan recreate container.
# Deploy langsung (tanpa menunggu 04:00), dari mesin yang bisa SSH ke VPS:
#   docker exec watchtower /watchtower --run-once
# Container produksi WAJIB memakai tag `:latest` (docker-compose.prod.yml
# default `${BACKEND_TAG:-latest}`); jangan lagi export BACKEND_TAG=<sha>,
# karena tag sha bersifat immutable dan tak akan pernah di-update Watchtower.
# ------------------------------------------------------------
