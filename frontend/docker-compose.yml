version: '3.8'

services:
  asncorpu-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asncorpu-frontend-nextjs
    expose:
      - "3004"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://asncorpu.local/apicorpu/5.0
      - NEXT_PUBLIC_BACKEND_URL=http://asncorpu.local
      - NEXT_PUBLIC_API_TIMEOUT=30000
      - NEXT_PUBLIC_APP_NAME=ASNCORPU
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    restart: unless-stopped
    networks:
      - shared-network

networks:
  shared-network:
    external: true
