services:
  # Backend - Django/Python
  asncorpu_backend:
    build: ./backend
    container_name: asncorpu_backend_app
    restart: unless-stopped
    command: gunicorn core.wsgi:application --config gunicorn.conf.py
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DEBUG=True
      - SECURE_SSL_REDIRECT=False
      - USE_X_FORWARDED_HOST=True
      - USE_X_FORWARDED_PORT=True
      # Verifikasi email pendaftaran (dok 23) — Mailpit di jaringan shared-network,
      # tanpa port host. Produksi: isi EMAIL_HOST/… lewat .env (SMTP resmi).
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=False
      - DEFAULT_FROM_EMAIL=ASN Corpu <no-reply@asncorpu.local>
      - FRONTEND_BASE_URL=http://localhost:3000
      # SSO Pemdi (OAuth2 + PKCE) — spec doc_dari_ai/opencode/asncorpu/sso/sso-asncorpu.md.
      # Saklar: kosongkan SSO_CLIENT_ID (via .env/override) untuk mematikan SSO Pemdi
      # → tombol SSO jatuh ke /oidc/ (bila OIDC lama diisi) atau halaman login.
      # Secret TIDAK ditulis di file ini — isi di docker-compose.override.yml / .env.
      - SSO_PEMDI_URL=https://pemdi.pesisirselatankab.go.id
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_WEBHOOK_SECRET=${SSO_WEBHOOK_SECRET:-}
      # APP_URL = origin yang terdaftar di Pemdi (redirect_uri .../api/sso/kembali).
      - APP_URL=${APP_URL:-http://localhost:3000}
      # 8020/18080 DICABUT TOTAL — D2 (push approval portal HENTI) & D3 (tombol
      # portal DIHAPUS), 23 Nov 2026. Tak ada lagi env portal/Keycloak di sini.
      # Rollback: git show 32daf99:docker-compose.yml + backup B5
      # /home/prakom/backup_vps_20261123/compose-env-4repo.tgz (env Keycloak lama).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - Next.js
  asncorpu-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: asncorpu-frontend-nextjs
    expose:
      - "3004"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=development
      - PORT=3004
      - WATCHPACK_POLLING=true
    restart: unless-stopped
    networks:
      - shared-network
    depends_on:
      - asncorpu_backend

  # Nginx Reverse Proxy
  asncorpu-nginx:
    image: nginx:alpine
    container_name: asncorpu-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    networks:
      - shared-network
    depends_on:
      - asncorpu_backend
      - asncorpu-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  static_volume:
  media_volume:
  logs_volume:

networks:
  shared-network:
    external: true
