# =============================================================================
# DEVELOPMENT BASE CONFIG — NOT for production use!
# For development:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# For production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# =============================================================================

services:
  # ESIMPEG Django Application
  esimpeg-python:
    build: .
    container_name: esimpeg_python_app
    restart: unless-stopped
    command: gunicorn esimpeg_core.wsgi:application --config gunicorn.conf.py
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DB_HOST=mysql-main
      - DB_NAME=esimpeg_python_db
      - DB_USER=root
      - DB_PASSWORD=5406@Pessel!23#
      - DB_PORT=3306
      - REDIS_HOST=redis-main
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5406@Pessel!23#
      - REDIS_DB=3
      - DJANGO_MAX_REQUEST_SIZE=134217728
      - GUNICORN_TIMEOUT=300
      - GUNICORN_WORKERS=4
      - GUNICORN_WORKER_CLASS=sync
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  static_volume:
  media_volume:
  logs_volume:
  mysql_data:
  redis_data:

networks:
  proxy-network:
    external: true
    name: proxy-network
