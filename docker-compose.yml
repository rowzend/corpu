services:
  # Backend - Django/Python
  asncorpu_backend:
    build: ./backend
    container_name: asncorpu_backend_app
    restart: unless-stopped
    command: gunicorn core.wsgi:application --config gunicorn.conf.py
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=postgres-main
      - DB_NAME=asncorpu_backend_db
      - DB_USER=asncorpu_user
      - DB_PASSWORD=asncorpu_secure_password_2026
      - DB_PORT=5432
      - REDIS_HOST=redis-main
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5406@Pessel!23#
      - REDIS_DB=4
      - DJANGO_MAX_REQUEST_SIZE=134217728
      - GUNICORN_TIMEOUT=300
      - GUNICORN_WORKERS=4
      - GUNICORN_WORKER_CLASS=sync
      - DEBUG=True
      - SECURE_SSL_REDIRECT=False
      # Force Django to use correct host/port for redirects
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,asncorpu_backend_app,asncorpu-nginx,192.1.6.21,192.1.6.6,192.168.1.12,192.1.6.43,172.16.30.139,103.143.152.139,asncorpu.pesisirselatankab.go.id
      - USE_X_FORWARDED_HOST=True
      - USE_X_FORWARDED_PORT=True
      - ESIMPEG_API_URL=http://172.16.30.139:8005
      - MINIO_ENDPOINT=http://172.16.7.66:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=5406@Pessel123
      - MINIO_BUCKET=asncorpu
      - MINIO_REGION=us-east-1
      - MINIO_USE_PROXY=True
      - MINIO_PROXY_URL=/media/minio/
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - Next.js
  asncorpu-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: asncorpu-frontend-nextjs
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    expose:
      - "3004"
    environment:
      - PORT=3004
      - NODE_ENV=development
      # NEXT_PUBLIC_* akan diakses dari browser, bukan dari container
      # Jadi harus menggunakan localhost:3000 (port nginx)
      - NEXT_PUBLIC_API_URL=http://localhost:3000/apicorpu/1.0
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000
      - NEXT_PUBLIC_API_TIMEOUT=30000
      - NEXT_PUBLIC_APP_NAME=ASNCORPU
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    restart: unless-stopped
    networks:
      - shared-network
    depends_on:
      - asncorpu_backend

  # Nginx Reverse Proxy
  asncorpu-nginx:
    image: nginx:alpine
    container_name: asncorpu-nginx
    restart: unless-stopped
    ports:
      - "3000:80"  # Akses via port 3000
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/usr/share/nginx/html/media
    networks:
      - shared-network
    depends_on:
      - asncorpu_backend
      - asncorpu-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  static_volume:
  media_volume:
  logs_volume:

networks:
  shared-network:
    external: true
